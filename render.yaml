services:
  - type: web
    name: webgenixx-backend
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: node backend/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://thewebgenixx.vercel.app
